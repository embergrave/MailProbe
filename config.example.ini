# First setup: copy to config.ini in the folder where you launch MailProbe.
# Replace these dummy credentials locally. SES SMTP credentials are region-specific.
[smtp]
host = email-smtp.us-east-1.amazonaws.com
port = 587
username = REPLACE_WITH_YOUR_SMTP_USERNAME
password = REPLACE_WITH_YOUR_SMTP_PASSWORD

# Optional message defaults. Recipients are always entered for each send.
[message]
default_file = message.eml
default_envelope_sender = test@example.com
